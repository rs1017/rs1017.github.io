name: Astro GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, migration/fuwari]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_ADSENSE_ENABLED: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_ADSENSE_ENABLED || 'false' }}
          PUBLIC_ADSENSE_POST_SLOT: ${{ vars.PUBLIC_ADSENSE_POST_SLOT }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
